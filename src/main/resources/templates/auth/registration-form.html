<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register New User Form</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <style>
        .error {
            color: red
        }
    </style>
</head>

<body>

<div th:replace="~{common/navbar :: navi(RegistrationForm)}"/>
<div class="container">
    <div id="loginbox" style="margin-top: 50px;"
         class="mainbox col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
        <div class="panel panel-primary">
            <div class="panel-heading">
                <div class="panel-title">Регистрация нового пользователя</div>
            </div>
            <div style="padding-top: 30px" class="panel-body">
                <form th:action="@{/auth/register}"
                      th:object="${userDto}" method="post" class="form-horizontal">
                    <div class="form-group">
                        <div class="col-xs-15">
                            <div th:if="${registrationError != null}">
                                <div class="alert alert-danger col-xs-offset-1 col-xs-10" th:text="${registrationError}">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- User name -->
                    <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"/>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                        <input th:field="*{username}" placeholder="Логин:" class="form-control"/>
                    </div>
                    <!-- Password -->
                    <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"/>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-lock"></i></span>
                        <input type="password" th:field="*{password}" placeholder="Пароль:" class="form-control"/>
                    </div>
                    <!-- Confirm Password -->
                    <div class="error" th:if="${#fields.hasErrors('matchingPassword')}"
                         th:errors="*{matchingPassword}"/>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-lock"></i></span>
                        <input type="password" th:field="*{matchingPassword}" placeholder="Повторите пароль:"
                               class="form-control"/>
                    </div>
                    <!-- First name -->
                    <div class="error" th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}"/>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                        <input th:field="*{firstname}" placeholder="Имя:" class="form-control"/>
                    </div>
                    <!-- Last name -->
                    <div class="error" th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}"/>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                        <input th:field="*{lastname}" placeholder="Фамилия:" class="form-control"/>
                    </div>
                    <!-- Email -->
                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"/>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                        <input th:field="*{email}" placeholder="Е-mail:" class="form-control"/>
                    </div>
                    <!-- Phone -->
                    <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"/>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                        <input th:field="*{phone}" placeholder="Телефон:" class="form-control"/>
                    </div>
                    <div style="margin-top: 2px" class="form-group">
                        <div>
                            <button type="submit" class="btn btn-primary">Регистрация</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <foot>
            <br>
            <br>
        </foot>
    </div>
</div>
<div th:replace="~{common/footer :: footerBlock}"/>
</body>
</html>
