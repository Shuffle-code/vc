<!DOCTYPE html>
<!--<html lang="en" xmlns:th="http://www.w3.org/1999/html">-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="navi(activeTab)">
    <a class="navbar-brand bi bi-camera-video me-4" th:href="@{/video}"> VideoStream TT Nsk</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarNav">
        </div>
        <ul class="navbar-nav">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" th:classappend="${activeTab == 'Participate' ? 'active' : ''}"
                   th:text="${session.countObservers == null ? 'Условия трансляции' : (session.countObservers == 0 ? 'Условия трансляции' : session.data + '(' + session.countObservers + ')')}">
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                    <li>
                        <a class="dropdown-item" th:classappend="${activeTab == 'Rules' ? 'active' : ''}" th:href="@{/video/rules}">Условия трансляции</a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:classappend="${activeTab == 'Participate' ? 'active' : ''}" th:href="@{/video}"
                           th:text="${session.countObservers == null ? '' : (session.countObservers == 0 ? session.data : session.data + '(' + session.countObservers + ')')}"></a>
                    </li>
                </ul>
            </li>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end" >
                <li sec:authorize="hasAuthority('observer.create')" class="nav-item">
                    <a class="btn btn-outline-success btn-rounded" th:classappend="${activeTab == 'TourNew' ? 'active' : ''}" th:href="@{/tour/new}">Создать турнир</a>
                <li class="nav-item">
                <li sec:authorize="hasAuthority('user')" class="nav-item">
                    <a type="button" class="btn btn-outline-warning btn-rounded" th:classappend="${activeTab == 'VIDEO' ? 'active' : ''}" th:href="@{/video}">Смотреть трансляцию</a>
                </li>
                <li sec:authorize="isAnonymous()" class="nav-item">
                    <a type="button" th:href="@{/auth/login}" class="btn btn-success">Войти</a>
                </li>
                <li sec:authorize="isAnonymous()" class="nav-item">
                    <a type="button" th:href="@{/auth/registration}" class="btn btn-primary">Регистрация</a>
                </li>
                <ul class="navbar-nav">
                    <li sec:authorize="isAuthenticated()" class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'PersonalArea' ? 'active' : ''}" th:href="@{/user}">Личный кабинет</a>
                    </li>
                    <img
                            th:src="${(session.user == null)} ? '' : '/observer/image/' + ${session.user.getObserver().getId()}"
                            class="rounded-circle"
                            height="40"
                            loading="lazy"
                    />
                </ul>
                <li sec:authorize="isAuthenticated()" class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <input type="submit" class="btn btn-outline-danger btn-rounded" value="Выйти"/>
                    </form>
                </li>
            </div>
        </ul>
    </div>
</nav>
</body>
</html>
