<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <!-- Head content -->
</head>
<body>
<!-- Navigation -->
<nav th:replace="fragments/navbar :: navbar"></nav>

<!-- Main content -->
<main>
  <div th:replace="fragments/online-counter :: online-counter"></div>
  <div th:insert="${content}"></div>
</main>

<!-- Auto-update online counter -->
<script>
  // Обновляем счетчик каждые 60 секунд
  setInterval(function() {
    fetch('/admin/online-stats')
            .then(response => response.json())
            .then(data => {
              const counter = document.querySelector('.online-counter strong');
              if (counter) {
                counter.textContent = data.totalOnline;
              }
            });
  }, 60000);
</script>
</body>
</html
