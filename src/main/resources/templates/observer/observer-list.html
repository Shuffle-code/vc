<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/html" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Список</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</head>
<body>


<div th:replace="~{common/navbar :: navi(ObserverList)}"></div>

<div class="d-flex justify-content-center">
    <span th:if="${observers.size() == 0}">Список пуст</span>
    <div th:unless="${observers.size() == 0}">
        <div class="p-1 text-center bg-light">
        <h2>Участники</h2>
        </div>
        <div class="form-outline">
            <input type="search" placeholder="Введите данные" class="form-control" id="datatable-search-input">
        </div>
        <table class="table table-hover" id="datatable">
            <thead class="bg-light">
            <tr>
                <th scope="col">№</th>
                <th colspan="2" scope="col">Фамилия</th>
                <th scope="col">Имя</th>
                <th scope="col">Год рождения</th>
<!--                <th scope="col">Адрес</th>-->
                <th scope="col" sec:authorize="hasAuthority('observer.update')">Редактировать</th>
                <th scope="col" sec:authorize="hasAuthority('observer.read') || isAnonymous()">Просмотреть</th>
                <th scope="col" sec:authorize="hasAuthority('observer.delete')">Удалить</th>
            </tr>
            </thead>
            <tbody data-mdb-spy="scroll">
            <tr th:each="observer, i : ${observers}"
                th:classappend="${observer.status.name() == 'ACTIVE'} ? 'table-success' : 'table-secondary'"
                th:attr="play_index=${observer.id}">
                <th scope="row" th:text="${i.count}"></th>
                <td>
                    <div >
                        <img th:src="@{'/observer/image/' + ${observer.id}}" alt="" width="40px" height="40" class="rounded-circle" />
                    </div>
                </td>
                <td th:text="${observer.lastname}"></td>
                <td th:text="${observer.firstname}"></td>
                <td th:text="${observer.yearOfBirth}"></td>
                <td sec:authorize="hasAuthority('observer.update')">
                    <a type="button"  th:href="@{/observer(id=${observer.id})}" class="btn btn-warning btn-rounded">Редактировать</a>
                </td>
                <td sec:authorize="hasAuthority('observer.read') || isAnonymous()">
                    <a type="button" th:href="@{'/observer/' + ${observer.id}}" class="btn btn-warning btn-rounded">Просмотреть</a>
                </td>
                <td sec:authorize="hasAuthority('observer.delete')">
                    <a type="button"  th:href="@{${'/observer/status_delete/' + observer.id}}" class="btn btn-danger btn-rounded">Удалить</a>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td scope="col">№</td>
                <td colspan="2" scope="col">Фамилия</td>
                <td scope="col">Имя</td>
                <td scope="col">Год рождения</td>
                <td scope="col" sec:authorize="hasAuthority('observer.update')">Редактировать</td>
                <td scope="col" sec:authorize="hasAuthority('observer.read') || isAnonymous()">Просмотреть</td>
                <td scope="col" sec:authorize="hasAuthority('observer.delete')">Удалить</td>
            </tr>
            </tfoot>
        </table>

        <foot>
            <br>
            <br>
        </foot>
</div>
<div th:replace="~{common/footer :: footerBlock}"/>
<!--<script src="/script/searce.js"></script>-->
</body>
</html>
